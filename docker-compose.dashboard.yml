# Live dashboard next to aicom-mesh-api on the factory host.
#
#   cd ai-service-mesh
#   docker compose -f docker-compose.prod.yml -f docker-compose.dashboard.yml up -d --build mesh-dashboard
#
# Public edge: deploy/nginx/service-mesh.modelmarket.dev.conf → :8091 + :8090

services:
  mesh-dashboard:
    image: aicom-mesh-dashboard:${AICOM_IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NGINX_CONF: nginx.static.conf
    container_name: aicom-mesh-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"

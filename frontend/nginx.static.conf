# Static SPA only — host nginx proxies /v1 and /health to aicom-mesh-api.
# Used when the dashboard sits behind service-mesh.modelmarket.dev.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        # Vite emits crossorigin on module scripts; same-origin still uses CORS mode.
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }
}
